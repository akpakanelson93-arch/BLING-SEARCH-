<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bling Search</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <div class="logo">
      <span class="bling-icon">B</span>
      <span>BLING</span>
    </div>
    <div class="header-links">
      <a href="#">Images</a>
      <a href="#">À propos</a>
    </div>
  </header>

  <main>
    <section class="search-area">
      <div class="brand">
        <span class="brand-b">B</span>
        <h1>BLING<span> Search</span></h1>
      </div>

      <p class="subtitle">Explorez le monde autrement.</p>

      <form id="searchForm">
        <div class="search-box">
          <span class="search-icon">⌕</span>
          <input
            type="search"
            id="searchInput"
            placeholder="Rechercher sur le Web..."
            autocomplete="off"
            required
          >
          <button type="submit">➜</button>
        </div>
      </form>

      <p class="powered">Une nouvelle façon de découvrir le Web.</p>
    </section>
  </main>

  <footer>
    <span>© 2026 BLING</span>
    <span>Search • Explore • Discover</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
